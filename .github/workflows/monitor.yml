name: Internship Monitor

on:
  schedule:
    # GitHub cron is best-effort: starts runs 5-60 min late and occasionally
    # drops a slot under load. Double density during Pacific work hours so
    # even a dropped slot leaves at most a ~1 hour gap when it matters.
    - cron: "17,47 0,14-23 * * *"      # every 30 min, 7am-5:59pm Pacific (PDT)
    - cron: "17 1,3,5,7,9,11,13 * * *" # every 2 hours overnight
  workflow_dispatch:
    inputs:
      mode:
        description: "Run mode"
        required: true
        default: "normal"
        type: choice
        options: [normal, audit]

permissions:
  contents: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run monitor
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          if [ "${{ github.event.inputs.mode }}" = "audit" ]; then
            python monitor.py --audit
          else
            python monitor.py
          fi

      - name: Alert on program crash
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: |
          curl -s -X POST -H "Content-Type: application/json" \
            -d '{"type":"failures","items":[{"company":"MONITOR PROGRAM ITSELF","reason":"The monitor run CRASHED - this is a program error, not a website problem. No sources were checked. See https://github.com/gunrajs10/internship-monitor/actions"}]}' \
            "$WEBHOOK_URL" || true

      - name: Commit updated state
        if: github.event.inputs.mode != 'audit'
        run: |
          git config user.name "monitor-bot"
          git config user.email "monitor-bot@users.noreply.github.com"
          git add state/seen.json
          git diff --cached --quiet && exit 0
          git commit -m "Update seen postings [skip ci]"
          # A bare `git push` loses the whole run's state if anything else
          # touched the repo while the monitor was running (a manual commit,
          # or a slow run overlapping the next one). seen.json is the dedupe
          # ledger: dropping it silently re-alerts old postings later, so the
          # push is retried on top of whatever landed in the meantime.
          for i in 1 2 3 4 5; do
            if git push; then exit 0; fi
            echo "push rejected (attempt $i) - union-merging state with origin"
            # Do NOT rebase: seen.json is append-only, so two overlapping runs
            # always produce a textual conflict that rebase cannot resolve and
            # that costs the whole run's state. Union the two ledgers instead,
            # replay onto origin/main, and retry.
            git fetch origin main
            git show origin/main:state/seen.json > /tmp/theirs.json 2>/dev/null || echo '{}' > /tmp/theirs.json
            python3 merge_state.py /tmp/theirs.json state/seen.json || exit 1
            git reset --mixed origin/main
            git add state/seen.json
            git diff --cached --quiet && exit 0
            git commit -m "Update seen postings [skip ci]"
            sleep $((i * 3))
          done
          echo "::error::could not push updated state after 5 attempts"
          exit 1
