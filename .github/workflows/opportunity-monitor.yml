name: Biotech Opportunity Monitor

on:
  schedule:
    - cron: '11 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: Run mode
        type: choice
        required: true
        default: dry-run
        options: [dry-run, audit, test-email, normal]

permissions:
  contents: write

# Independent group prevents the frequent ATS schedule replacing a queued run.
# The state files are separate; the commit step rebases over unrelated updates.
concurrency:
  group: opportunity-monitor
  cancel-in-progress: false

jobs:
  opportunities:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline behavior checks
        run: python -m unittest discover -p 'test_opportunity_*.py' -v
      - name: Discover, rank, and notify
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          RUN_MODE: ${{ github.event.inputs.mode || 'normal' }}
        run: python opportunity_monitor.py --"$RUN_MODE"
      - name: Preserve queue even after a failed delivery
        if: always() && (github.event_name == 'schedule' || inputs.mode == 'normal')
        run: |
          if [ ! -f state/opportunity.json ]; then exit 0; fi
          git config user.name 'monitor-bot'
          git config user.email 'monitor-bot@users.noreply.github.com'
          git add state/opportunity.json
          git diff --cached --quiet && exit 0
          git commit -m 'Save opportunity queue and delivery receipts [skip ci]'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git pull --rebase origin main || exit 1
            sleep $((attempt * 2))
          done
          echo '::error::Opportunity state push failed; inspect this run before retrying.'
          exit 1
      - name: Send failure notification
        if: failure()
        env:
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
        run: python opportunity_monitor.py --failure-email
      - name: Save preview and recovery state
        if: failure() || github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: opportunity-preview-and-recovery
          path: |
            opportunity-preview.html
            state/opportunity.json
          if-no-files-found: ignore
          retention-days: 3
